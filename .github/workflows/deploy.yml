name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3.0.5
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
